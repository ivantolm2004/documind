<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocuMind — поиск с цитатами</title><meta name="description" content="Приватный поиск по документам в браузере"><style>
:root{--bg:#0d1020;--panel:#15192d;--line:#292f49;--ink:#f5f5f0;--muted:#9ca4bf;--violet:#9d7cff;--mint:#83ffd0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,sans-serif;min-height:100vh}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:900;margin-bottom:36px}.logo i{color:var(--violet);font-style:normal}.new{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:13px;border-radius:10px;text-align:left;cursor:pointer}.label{margin:28px 8px 10px;color:var(--muted);font-size:11px;letter-spacing:1.4px;text-transform:uppercase}.doc{padding:11px;border-radius:9px;color:var(--muted)}.doc small{display:block;margin-top:4px}.security{margin-top:auto;border:1px solid #284d45;background:#142923;padding:14px;border-radius:10px;color:#a9ddcb;font-size:12px}.main{display:flex;flex-direction:column;min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw}.badge{color:var(--mint);border:1px solid #315d53;padding:7px 11px;border-radius:99px;font-size:12px}.content{width:min(850px,90%);margin:auto;padding:48px 0;flex:1}.eyebrow{color:var(--violet);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}h1{font-size:clamp(38px,6vw,68px);letter-spacing:-3px;line-height:1;margin:16px 0}.intro{color:var(--muted);font-size:17px;line-height:1.6;max-width:660px}.suggestions{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.suggestions button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:99px;cursor:pointer}.composer{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:0 18px 50px #0006}.composer input{flex:1;background:transparent;border:0;color:var(--ink);padding:12px;outline:0;font-size:15px}.composer button{background:var(--violet);color:white;border:0;border-radius:9px;padding:0 18px;cursor:pointer;font-weight:800}.results{display:grid;gap:12px;margin-top:24px}.answer{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:12px;line-height:1.7}.answer mark{background:#9d7cff40;color:var(--mint);padding:1px 2px}.source{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-top:12px}.source span{background:#282d48;padding:5px 9px;border-radius:5px}.empty{color:var(--muted);padding:20px 0}@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 5vw}.content{padding-top:35px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">Docu<i>Mind</i></div><button class="new" id="upload">＋ Загрузить TXT / MD</button><input id="files" type="file" accept=".txt,.md,text/plain,text/markdown" multiple hidden><div class="label">Индекс документов</div><div id="documents"></div><div class="security">🔒 Файлы индексируются локально и не отправляются на сервер</div></aside><main class="main"><header class="top"><span>Локальная база знаний</span><span class="badge" id="status">● демо-индекс готов</span></header><section class="content"><p class="eyebrow">Проверяемый поиск</p><h1>Найдите факт.<br>Проверьте источник.</h1><p class="intro">Загрузите документы или используйте встроенный пример. Результаты ранжируются и всегда ссылаются на конкретный абзац.</p><div class="suggestions"><button>Какой срок оплаты?</button><button>Когда возможен возврат?</button><button>Какая пеня за просрочку?</button></div><form class="composer"><input id="question" placeholder="Спросите о документах…"><button>Найти →</button></form><div class="results" id="results"></div></section></main></div><script type="module">
import{buildIndex,highlight,search}from'./src/search.js';let docs=[{id:'demo',name:'Договор поставки.txt',text:'Оплата производится в течение 10 рабочих дней после подписания акта.\n\nПри задержке оплаты более чем на 5 дней начисляется пеня 0,1 процента за каждый день просрочки.\n\nВозврат товара надлежащего качества возможен в течение 14 календарных дней.'}],index=buildIndex(docs);const list=document.querySelector('#documents'),results=document.querySelector('#results'),question=document.querySelector('#question');function renderDocs(){list.innerHTML=docs.map(d=>`<div class="doc">📄 ${d.name}<small>${d.text.length.toLocaleString('ru-RU')} символов</small></div>`).join('');document.querySelector('#status').textContent=`● ${docs.length} файлов · ${index.chunks.length} абзацев`}async function addFiles(files){const loaded=await Promise.all([...files].map(async f=>({id:crypto.randomUUID(),name:f.name,text:await f.text()})));docs=[...docs,...loaded];index=buildIndex(docs);renderDocs()}document.querySelector('#upload').onclick=()=>document.querySelector('#files').click();document.querySelector('#files').onchange=e=>addFiles(e.target.files);document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{question.value=b.textContent;document.querySelector('form').requestSubmit()});document.querySelector('form').onsubmit=e=>{e.preventDefault();const found=search(index,question.value);results.innerHTML=found.length?found.map(x=>`<article class="answer">${highlight(x.text,x.matched)}<div class="source"><span>${x.name}</span>Абзац ${x.paragraph} · релевантность ${x.score.toFixed(3)}</div></article>`).join(''):'<p class="empty">Совпадений не найдено. Попробуйте другие ключевые слова.</p>'};renderDocs();
</script></body></html>
